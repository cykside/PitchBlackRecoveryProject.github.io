<div id="pbrp-downloads" class="my-8 not-prose">
  <!-- Loading State -->
  <div class="animate-pulse flex flex-col items-center justify-center p-8 border border-fg/15 rounded-2xl bg-fg/5">
    <i class="fas fa-circle-notch fa-spin text-2xl text-fg mb-2"></i>
    <span class="text-muted font-mono text-sm">Loading builds…</span>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const container = document.getElementById('pbrp-downloads');
  const codename = '{{ page.codename }}';
  
  try {
    const response = await fetch(`{{ '/assets/json/' | relative_url }}builds-${codename}.json`);
    if (!response.ok) throw new Error(`${response.status}`);
    
    const data = await response.json();
    let html = `<div class="space-y-6">`;
    
    // Latest Build Section
    if (data.latest) {
      html += `
        <div>
          <h2 class="text-xl font-display font-bold text-fg mb-4 flex items-center gap-2">
            Latest build
          </h2>
          ${renderCard(data.latest, true)}
        </div>`;
    }

    // Older Builds Section
    if (data.older_builds && data.older_builds.length > 0) {
      html += `
        <div class="pt-8 mt-8 border-t border-fg/15">
          <h3 class="text-lg font-display font-bold text-fg/80 mb-4">Older Versions</h3>
          <div class="space-y-4">
            ${data.older_builds.map(build => renderCard(build, false)).join('')}
          </div>
        </div>`;
    }

    html += `</div>`;
    container.innerHTML = html;

  } catch (error) {
    container.innerHTML = `
      <div class="bg-fg/5 border border-fg/25 rounded-xl p-4 text-center text-fg">
        <p class="font-bold"><i class="fas fa-exclamation-triangle"></i> Downloads Unavailable</p>
        <p class="text-sm opacity-80 mt-1">Could not fetch builds for ${codename}</p>
      </div>
    `;
  }
  
  function renderCard(build, isLatest) {
    const type = build.build_type || 'OFFICIAL', official = type === 'OFFICIAL';
    const badge = official ? 'bg-fg text-bg' : 'border border-fg/40 text-fg';
    return `
      <article class="rounded-2xl p-5 border ${isLatest ? 'border-fg bg-surface' : 'border-fg/15'}">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-5">
          <div>
            <div class="flex flex-wrap items-center gap-3">
              <span class="font-mono font-bold text-2xl text-fg">v${build.version}</span>
              <span class="text-[10px] font-bold tracking-widest uppercase px-2.5 py-1 rounded-full ${badge}">${type}</span>
              ${isLatest ? '<span class="text-[10px] font-bold tracking-widest uppercase text-muted">Latest</span>' : ''}
            </div>
            <p class="mt-1 text-xs font-mono text-muted"><i class="far fa-calendar mr-1"></i>${build.date}</p>
          </div>
          <div class="flex gap-2">
            ${build.github_release ? `<a href="${build.github_release}" target="_blank" rel="noopener" class="btn btn-ghost !px-4" aria-label="GitHub release"><i class="fab fa-github text-lg"></i></a>` : ''}
            <a href="${build.download_link}" target="_blank" rel="noopener" class="btn btn-primary flex-1 md:flex-none"><i class="fas fa-download"></i> Download</a>
          </div>
        </div>
        ${build.changelog ? `<details class="mt-4 group"><summary class="cursor-pointer list-none text-xs text-muted hover:text-fg flex items-center gap-2"><i class="fas fa-chevron-right transition-transform group-open:rotate-90"></i> Changelog</summary>
          <div class="mt-3 p-4 rounded-lg border border-fg/15 bg-bg text-sm text-fg/80 font-mono whitespace-pre-line leading-relaxed">${build.changelog}</div></details>` : ''}
      </article>`;
  }
});
</script>

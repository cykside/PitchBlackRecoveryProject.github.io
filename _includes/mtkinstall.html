{% if page.mtkchipset %}
<div class="bg-surface border border-fg/15 rounded-xl p-6 mb-6 shadow-lg not-prose">
  <h3 class="text-xl font-display font-bold text-fg mb-4 flex items-center gap-2 border-b border-fg/10 pb-2">
    <i class="fas fa-microchip text-fg"></i> SP Flash Tool
  </h3>

  <ul class="space-y-3 text-fg/80 text-sm">
    <li class="flex gap-3">
      <i class="fas fa-check text-fg mt-1"></i>
      <span>Load the scatter file from your device's stock firmware.</span>
    </li>
    <li class="flex gap-3">
      <i class="fas fa-check text-fg mt-1"></i>
      <span>Uncheck all partitions except <strong>RECOVERY</strong>.</span>
    </li>
    <li class="flex gap-3">
      <i class="fas fa-check text-fg mt-1"></i>
      <span>Click the RECOVERY location and select <code>pbrp.img</code>.</span>
    </li>
    <li class="flex gap-3">
      <i class="fas fa-check text-fg mt-1"></i>
      <span>Click <strong>Download</strong>, then connect powered-off device via USB.</span>
    </li>
  </ul>
</div>
{% endif %}

<div class="bg-surface border border-fg/15 rounded-xl p-6 mb-6 shadow-lg not-prose">
  <h3 class="text-xl font-display font-bold text-fg mb-4 flex items-center gap-2 border-b border-fg/10 pb-2">
    <i class="fas fa-box-open text-fg"></i> Legacy A/B Install
  </h3>

  <ol class="list-decimal pl-5 space-y-4 text-fg/80 text-sm marker:text-fg marker:font-bold">
    <li>
      <p class="mb-2">Temporarily boot PBRP image:</p>
      <div class="codebox">fastboot boot pbrp.img</div>
    </li>
    <li>
      <p class="mb-2">Push the installer zip to device:</p>
      <div class="codebox">adb push pbrp.zip /</div>
    </li>
    <li>
      <p>On the device, go to <strong>Install</strong>, select the zip, and swipe to flash.</p>
      <p class="text-muted text-xs mt-1">This installs PBRP to both slots.</p>
    </li>
  </ol>
</div>

<div id="pbrp-downloads" class="my-8 not-prose">
  <!-- Loading State -->
  <div class="animate-pulse flex flex-col items-center justify-center p-8 border border-fg/15 rounded-2xl bg-fg/5">
    <i class="fas fa-circle-notch fa-spin text-2xl text-fg mb-2"></i>
    <span class="text-muted font-mono text-sm">Loading builds…</span>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const container = document.getElementById('pbrp-downloads');
  const codename = '{{ page.codename }}';
  
  try {
    const response = await fetch(`/assets/json/builds-${codename}.json`);
    if (!response.ok) throw new Error(`${response.status}`);
    
    const data = await response.json();
    let html = `<div class="space-y-6">`;
    
    // Latest Build Section
    if (data.latest) {
      html += `
        <div>
          <h2 class="text-xl font-display font-bold text-fg mb-4 flex items-center gap-2">
            <i class="fas fa-star"></i> Latest Build
          </h2>
          ${renderCard(data.latest, true)}
        </div>`;
    }

    // Older Builds Section
    if (data.older_builds && data.older_builds.length > 0) {
      html += `
        <div class="pt-8 mt-8 border-t border-fg/15">
          <h3 class="text-lg font-display font-bold text-fg/80 mb-4">Older Versions</h3>
          <div class="space-y-4">
            ${data.older_builds.map(build => renderCard(build, false)).join('')}
          </div>
        </div>`;
    }

    html += `</div>`;
    container.innerHTML = html;

  } catch (error) {
    container.innerHTML = `
      <div class="bg-fg/5 border border-fg/25 rounded-xl p-4 text-center text-fg">
        <p class="font-bold"><i class="fas fa-exclamation-triangle"></i> Downloads Unavailable</p>
        <p class="text-sm opacity-80 mt-1">Could not fetch builds for ${codename}</p>
      </div>
    `;
  }
  
  function renderCard(build, isLatest) {
    const buildType = build.build_type || 'OFFICIAL';
    const isOfficial = buildType === 'OFFICIAL';
    
    // Card Styling
    const cardBg = isLatest 
        ? 'bg-surface border-l-4 border-l-pbrp-red border-y border-r border-fg/15 shadow-lg ' 
        : 'bg-surface border border-fg/10 hover:border-fg/15';

    const badgeStyle = isOfficial
        ? 'bg-fg text-bg border border-fg'
        : 'bg-fg/5 text-fg border border-fg/25';

    return `
      <div class="rounded-xl p-5 relative transition-all duration-300 hover:-translate-y-1 ${cardBg}">
        <div class="flex flex-col md:flex-row justify-between gap-6 items-start md:items-center">
          
          <!-- Version Info -->
          <div class="flex items-center gap-4">
            <div class="h-14 w-14 rounded-lg bg-fg/5 flex items-center justify-center text-fg font-mono font-bold text-xl border border-fg/10 shrink-0">
              v${build.version.split('.')[0]}
            </div>
            <div>
              <div class="flex flex-wrap items-center gap-2 mb-1">
                <span class="text-xl font-bold text-fg font-mono">v${build.version}</span>
                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded ${badgeStyle}">${buildType}</span>
              </div>
              <div class="text-xs text-muted font-mono flex items-center gap-2">
                <i class="far fa-calendar"></i> ${build.date}
              </div>
            </div>
          </div>

          <!-- Buttons -->
          <div class="flex gap-3 w-full md:w-auto">
            ${build.github_release ? `
            <a href="${build.github_release}" target="_blank" class="h-12 w-12 flex items-center justify-center rounded-lg bg-fg/5 hover:bg-fg/10 border border-fg/15 !text-fg transition-colors shrink-0">
                <i class="fab fa-github text-xl"></i>
            </a>` : ''}
            
            <a href="${build.download_link}" target="_blank" class="h-12 flex-grow md:flex-none px-8 rounded-lg bg-fg hover:opacity-85 !text-bg font-bold shadow-lg  transition-all flex items-center justify-center gap-2 whitespace-nowrap min-w-[140px] no-underline">
                <i class="fas fa-download"></i>
                <span>Download</span>
            </a>
          </div>
        </div>

        <!-- Changelog -->
        ${build.changelog ? `
        <details class="mt-4 group">
            <summary class="flex items-center gap-2 text-xs text-muted cursor-pointer hover:text-fg transition-colors list-none select-none">
                <i class="fas fa-chevron-right transition-transform group-open:rotate-90"></i> View Changelog
            </summary>
            <div class="mt-3 p-4 bg-bg/40 rounded-lg border border-fg/10 text-sm text-fg/80 font-mono whitespace-pre-line leading-relaxed">
                ${build.changelog.replace(/\n/g, '<br>')}
            </div>
        </details>` : ''}
      </div>
    `;
  }
});
</script>

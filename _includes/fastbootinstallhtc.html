<div class="bg-surface border border-fg/15 rounded-xl p-6 mb-6 shadow-lg not-prose">
  <h3 class="text-xl font-display font-bold text-fg mb-4 flex items-center gap-2 border-b border-fg/10 pb-2">
    <i class="fas fa-mobile text-fg"></i> HTC Install Method
  </h3>

  <div class="space-y-4">
    <div>
      <p class="text-muted text-sm mb-2">1. Enter Download Mode:</p>
      <div class="codebox">
        adb reboot download
      </div>
    </div>

    <div>
      <p class="text-muted text-sm mb-2">2. Flash Recovery:</p>
      <div class="codebox">
        fastboot flash recovery pbrp.img
      </div>
    </div>
    
    <div>
      <p class="text-muted text-sm mb-2">3. Reboot:</p>
      <div class="codebox">
        fastboot reboot
      </div>
    </div>
  </div>
</div>
